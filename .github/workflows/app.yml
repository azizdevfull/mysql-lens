name: MySQL Lens app (Tauri)

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install dependencies
        run: npm ci

      - name: Rust unit tests
        run: cargo test -p lens-core --lib

      - name: Build installer
        run: npx tauri build

      - name: Smoke test
        run: node scripts/smoke.mjs target/release/mysql-lens.exe smoke-out

      - name: Sizes
        shell: pwsh
        run: Get-ChildItem target/release/mysql-lens.exe, target/release/bundle/nsis/*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: app/smoke-out/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mysql-lens-installer
          path: app/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: MySQL Lens ${{ github.ref_name }}
          files: app/target/release/bundle/nsis/*.exe
          body: |
            New, lightweight MySQL Lens built with Tauri + Rust.

            - Modern interface, Excel-like data grid, row inspector, SQL autocomplete
            - Unlimited connections, SSH tunnels, passwords in Windows Credential Manager
            - Export to CSV, Excel, JSON, SQL, Markdown

            The installer is not code-signed yet, so Windows SmartScreen / Smart App Control may warn.
