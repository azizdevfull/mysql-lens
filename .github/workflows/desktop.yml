name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install shared dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Typecheck
        run: npm run typecheck
        working-directory: desktop

      - name: Build installer and portable exe
        run: npm run dist:win
        working-directory: desktop

      - name: Smoke test the packaged app
        run: node test/smoke.cjs "release/win-unpacked/MySQL Lens.exe" smoke-out
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: desktop/smoke-out/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mysql-lens-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: MySQL Lens Desktop ${{ github.ref_name }}
          make_latest: false
          files: desktop/release/*.exe
          body: |
            Windows desktop app for MySQL / MariaDB.

            - `MySQL-Lens-*-x64-win.exe` — installer
            - `MySQL-Lens-*-portable.exe` — runs without installing

            The executables are not code-signed yet, so Windows SmartScreen may show
            "Windows protected your PC". Click **More info → Run anyway**.
